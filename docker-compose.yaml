version: '3.8'

services:
  universal-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: universal-proxy
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # 从.env文件加载环境变量
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      # 挂载日志目录（如果需要）
      - ./logs:/usr/src/app/logs


